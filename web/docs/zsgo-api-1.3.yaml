webhooks:
  paymentReceived:
    post:
      tags:
        - Payment Webhooks
      summary: payment.received — payment confirmed, no automatic receipt
      description: Sent when the payment entity confirms a payment and automatic
        receipts are **off** (ZS GO leaves the document untouched), or when the
        paid amount differs from the invoice total (`receipt_created` is
        `false`, no receipt issued). `receipt` is `null`; `document` may be
        `null` when no open invoice matches the reference.
      operationId: webhook.payment.received
      parameters:
        - name: X-ZSGO-Event
          in: header
          required: true
          description: Event type.
          schema:
            type: string
            enum:
              - payment.received
        - name: X-ZSGO-Delivery
          in: header
          required: true
          description: Unique event id (same as `event_id` in the body); repeated on
            retries.
          schema:
            type: string
            format: uuid
        - name: X-ZSGO-Timestamp
          in: header
          required: true
          description: Send time as Unix seconds. Reject if older than 5 minutes.
          schema:
            type: string
            example: "1758190000"
        - name: X-ZSGO-Signature
          in: header
          required: true
          description: '`sha256=` + hex HMAC-SHA256 computed with the entity secret over
            `"{timestamp}.{raw body}"`.'
          schema:
            type: string
            example: sha256=5d41402abc4b2a76b9719d911017c592…
        - name: User-Agent
          in: header
          required: true
          description: Always `ZSGO-Webhook/1.0`.
          schema:
            type: string
            enum:
              - ZSGO-Webhook/1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookEvent"
            example:
              event: payment.received
              event_id: 6f1c2a3e-8b7d-4c21-9f0e-2d5a7b8c9d01
              occurred_at: 2026-09-18T10:15:30+01:00
              entity: lusopay
              method: multibanco
              amount: 123.45
              currency: EUR
              paid_at: 2026-09-18T10:15:12+01:00
              reference:
                entity: "12345"
                reference: "123456789"
              receipt_created: false
              document:
                id: c1f5e6d7-1234-4abc-9def-0123456789ab
                type: FA
                series: A
                number: 1001
                label: FA A/1001
                date: 2026-09-01
                due_date: 2026-10-01
                total: 123.45
                total_paid: 0
                status: 5
                mb_reference: "123456789"
                client:
                  id: 1
                  name: Cliente Exemplo
                  tax_id: "500000000"
              receipt: null
              company:
                id: 1
                name: A Minha Empresa, Lda
                tax_id: "509999990"
      responses:
        2XX:
          description: Delivered. Any 2xx status within 10 s marks the delivery as
            successful.
        default:
          description: "Treated as a failure: the delivery is retried (3 attempts in
            total) with the same body and headers."
      security: []
  receiptCreated:
    post:
      tags:
        - Payment Webhooks
      summary: receipt.created — payment confirmed and receipt issued
      description: "Sent when automatic receipts are **on**: the receipt has been
        issued and the invoice is now paid (`document.status` = 7,
        `document.total_paid` = amount). `receipt` identifies the issued
        receipt."
      operationId: webhook.receipt.created
      parameters:
        - name: X-ZSGO-Event
          in: header
          required: true
          description: Event type.
          schema:
            type: string
            enum:
              - receipt.created
        - name: X-ZSGO-Delivery
          in: header
          required: true
          description: Unique event id (same as `event_id` in the body); repeated on
            retries.
          schema:
            type: string
            format: uuid
        - name: X-ZSGO-Timestamp
          in: header
          required: true
          description: Send time as Unix seconds. Reject if older than 5 minutes.
          schema:
            type: string
            example: "1758190000"
        - name: X-ZSGO-Signature
          in: header
          required: true
          description: '`sha256=` + hex HMAC-SHA256 computed with the entity secret over
            `"{timestamp}.{raw body}"`.'
          schema:
            type: string
            example: sha256=5d41402abc4b2a76b9719d911017c592…
        - name: User-Agent
          in: header
          required: true
          description: Always `ZSGO-Webhook/1.0`.
          schema:
            type: string
            enum:
              - ZSGO-Webhook/1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookEvent"
            example:
              event: receipt.created
              event_id: 6f1c2a3e-8b7d-4c21-9f0e-2d5a7b8c9d01
              occurred_at: 2026-09-18T10:15:30+01:00
              entity: lusopay
              method: multibanco
              amount: 123.45
              currency: EUR
              paid_at: 2026-09-18T10:15:12+01:00
              reference:
                entity: "12345"
                reference: "123456789"
              receipt_created: true
              document:
                id: c1f5e6d7-1234-4abc-9def-0123456789ab
                type: FA
                series: A
                number: 1001
                label: FA A/1001
                date: 2026-09-01
                due_date: 2026-10-01
                total: 123.45
                total_paid: 123.45
                status: 7
                mb_reference: "123456789"
                client:
                  id: 1
                  name: Cliente Exemplo
                  tax_id: "500000000"
              receipt:
                id: 501
                type: RC
                series: A
                number: 87
                label: RC A/87
                date: 2026-09-18
                datetime: 2026-09-18T10:15:30+01:00
                total: 123.45
              company:
                id: 1
                name: A Minha Empresa, Lda
                tax_id: "509999990"
      responses:
        2XX:
          description: Delivered. Any 2xx status within 10 s marks the delivery as
            successful.
        default:
          description: "Treated as a failure: the delivery is retried (3 attempts in
            total) with the same body and headers."
      security: []
  webhookTest:
    post:
      tags:
        - Payment Webhooks
      summary: webhook.test — test delivery from the settings screen
      description: 'Sent from the "Testar webhook" button with sample data (`test:
        true`). Signed exactly like real events, so it can be used to validate

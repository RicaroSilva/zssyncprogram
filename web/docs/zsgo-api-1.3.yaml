    UpsertProductRequest:
      type: object
      properties:
        identity:
          type: object
          description: Product identity data.
          examples:
            - reference: ART001
              description: Consulting service
          properties:
            reference:
              type: string
              description: Product reference used as the public identifier.
              maxLength: 100
            description:
              type: string
              description: Product description shown in documents.
              maxLength: 500
          required:
            - reference
            - description
        classification:
          type:
            - object
            - "null"
          description: Product classification and catalog metadata.
          examples:
            - family_id: 1
              unit_code: UN
              item_type_code: P
          properties:
            family_id:
              type: integer
              description: Product family identifier.
            unit_code:
              type:
                - string
                - "null"
              description: Unit code used for quantities.
              maxLength: 20
            supplier_code:
              type:
                - string
                - "null"
              description: Default supplier code.
              maxLength: 50
            item_type_code:
              type: string
              description: "Item type code: P (product), S (service), O (other e.g.
                shipping)."
              enum:
                - P
                - S
                - O
            saft_item_type_code:
              type:
                - string
                - "null"
              description: "SAF-T item type code: P (product), S (service), O (other), E
                (excise taxes), I (other taxes/fees)."
              enum:
                - P
                - S
                - O
                - E
                - I
                - null
            inventory_item_type_code:
              type:
                - string
                - "null"
              description: "Inventory item type code: M (merchandise), A
                (finished/intermediate products), P (raw materials), S
                (by-products/waste), T (work in progress), B (biological
                assets)."
              enum:
                - M
                - A
                - P
                - S
                - T
                - B
                - null
            stock_control:
              type:
                - boolean
                - "null"
              description: Whether the product controls stock movements. Only applicable when
                item_type_code is P.
          required:
            - family_id
            - item_type_code
        pricing:
          type: object
          description: Product purchase and sale prices.
          examples:
            - purchase_price:
                unit_price_net: 10
              sale_prices:
                - price_line: 1
                  unit_price_net: 20
          properties:
            purchase_price:
              type: object
              description: Default purchase price data.
              properties:
                unit_price_net:
                  type: number
                  description: Net purchase unit price without tax.
                  minimum: 0
                unit_price:
                  type:
                    - number
                    - "null"
                  description: Gross purchase unit price with tax.
                  minimum: 0
                fixed_rate:
                  type:
                    - number
                    - "null"
                  description: Fixed purchase tax rate.
              required:
                - unit_price_net
            sale_prices:
              type: array
              description: Sale prices by price line.
              items:
                type: object
                properties:
                  price_line:
                    type: integer
                    description: Price line identifier.
                    minimum: 1
                  unit_price_net:
                    type: number
                    description: Net sale unit price without tax.
                    minimum: 0
                  unit_price:
                    type:
                      - number
                      - "null"
                    description: Gross sale unit price with tax.
                    minimum: 0
                  fixed_rate:
                    type:
                      - number
                      - "null"
                    description: Fixed sale tax rate.
              minItems: 1
          required:
            - purchase_price
            - sale_prices
        tax:
          type: object
          description: Product default tax configuration.
          examples:
            - sale_tax: 23
              purchase_tax: 23
              exemption_code: null
          properties:
            sale_tax:
              type: number
              description: Default sale tax rate.
              minimum: 0
            purchase_tax:
              type: number
              description: Default purchase tax rate.
              minimum: 0
            exemption_code:
              type:
                - string
                - "null"
              description: Tax exemption code when tax rate is zero.
              maxLength: 20
          required:
            - sale_tax
            - purchase_tax
        settings:
          type: object
          description: Product settings and flags.
          properties:
            discontinued:
              type:
                - boolean
                - "null"
              description: Whether the product is discontinued.
        taxes:
          type:
            - string
            - "null"
          description: Optional taxes payload.
        prices:
          type:
            - string
            - "null"
          description: Optional prices payload.
      required:
        - identity
        - classification
        - pricing
        - tax
      title: UpsertProductRequest
    UpsertPurchaseRequest:
      type: object
      properties:
        pdf:
          type:
            - boolean
            - "null"
          description: "Deprecated and ignored: the response always includes pdf_url, a
            link that renders the PDF on demand."
        supplier:
          type: object
          description: Supplier associated with the purchase document.
          examples:
            - code: FOR001
          properties:
            code:
              type: string
              description: Supplier code.
          required:
            - code
        document:
          type: object
          description: Purchase document metadata.
          examples:
            - type: CFA
              transaction_date: 2026-05-27
              payment_method_id: "1"
              warehouse_id: "1"
              currency: EUR
          properties:
            type:
              type: string
              description: "Purchase document type acronym. Allowed types: CFA, CFS, CFR."
            transaction_date:
              type:
                - string
                - "null"
              format: date
              description: Supplier transaction date in YYYY-MM-DD format.
            system_entry_date:
              type:
                - string
                - "null"
              format: date-time
              description: System entry date.
            auto_confirm:
              type:
                - boolean
                - "null"
              description: Whether the document should be finalized automatically.
            payment_option_id:
              type:
                - string
                - "null"
              description: Payment option identifier.
            payment_method_id:
              type:
                - string
                - "null"
              description: Payment method identifier.
            warehouse_id:
              type:
                - string
                - "null"
              description: Warehouse identifier used for stock movements.
            reference:
              type:
                - string
                - "null"
              description: Supplier document reference.
            notes:
              type:
                - string
                - "null"
              description: Document notes. Use \n to separate lines.
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              minLength: 3
              maxLength: 3
            pdf:
              type:
                - boolean
                - "null"
              description: "Deprecated and ignored: the response always includes pdf_url, a
                link that renders the PDF on demand."
            discount1:
              type:
                - number
                - "null"
              description: Header discount percentage 1.
              minimum: 0
            discount2:
              type:
                - number
                - "null"
              description: Header discount percentage 2.
              minimum: 0
            discount3:
              type:
                - number
                - "null"
              description: Header discount percentage 3.
              minimum: 0
          required:
            - type
        items:
          type: array
          description: Purchase document lines.
          examples:
            - - product_reference: ART001
                quantity: 2
                unit_price_net: 10
                taxes:
                  - tax_rate: 23
          items:
            type: object
            properties:
              product_reference:
                type: string
                description: Product reference purchased in this line.
              quantity:
                type: number
                description: Quantity purchased.
              unit_price_net:
                type: number
                description: Net unit price without tax.
                minimum: 0
              taxes:
                type: array
                description: Tax rows applied to this line.
                items:
                  type: object
                  properties:
                    tax_rate:
                      type: number
                      description: Tax rate percentage.
                      minimum: 0
                    exemption_code:
                      type:
                        - string
                        - "null"
                      description: Tax exemption code when tax rate is zero.
                      maxLength: 20
                    exemption_reason:
                      type:
                        - string
                        - "null"
                      description: Tax exemption legal reason.
                  required:
                    - tax_rate
                minItems: 1
              discount1:
                type:
                  - number
                  - "null"
                description: Line discount percentage 1.
                minimum: 0
              discount2:
                type:
                  - number
                  - "null"
                description: Line discount percentage 2.
                minimum: 0
              discount3:
                type:
                  - number
                  - "null"
                description: Line discount percentage 3.
                minimum: 0
              notes:
                type:
                  - string
                  - "null"
                description: Line notes. Use \n to separate lines.
            required:
              - product_reference
              - quantity
              - unit_price_net
              - taxes
      required:
        - supplier
        - document
        - items
      title: UpsertPurchaseRequest
    UpsertSaleRequest:
      type: object
      properties:
        pdf:
          type:
            - boolean
            - "null"
          description: "Deprecated and ignored: the response always includes pdf_url, a
            link that renders the PDF on demand."
        email:
          type:
            - object
            - "null"
          description: |-
            Optional: email the generated PDF after the document is finalized.
            When omitted, no email is sent. When `to` is omitted, the document
            client's email is used. Best-effort — a failed send is reported in
            the response `meta.email_warning` and does not fail creation.
          examples:
            - to:
                - customer@example.com
              cc:
                - copy@example.com
          properties:
            to:
              type:
                - array
                - "null"
              description: Primary recipients (TO).
              items:
                type: string
                format: email
            cc:
              type:
                - array
                - "null"
              description: Carbon-copy recipients (CC).
              items:
                type: string
                format: email
        customer:
          type: object
          description: |-
            Customer billed by the sales document. Not required for credit
            notes (type NC), whose customer is derived from the credited
            source documents.
          examples:
            - code: CLI001
          properties:
            code:
              type: string
              description: Customer code.
          required:
            - code
        document:
          type: object
          description: Sales document metadata.
          examples:
            - type: FA
              issue_date: 2026-05-27
              payment_method_id: "1"
              warehouse_id: "1"
              currency: EUR
          properties:
            type:
              type: string
              description: "Sales document type acronym. Allowed types: FA, FR, FS, NC, GT,
                GR, FP, ORC. NC = credit note (see items origin_id /
                origin_line_id); GT/GR = transport guides (require a transport
                block); FP/ORC = proforma / quote."
            series:
              type:
                - string
                - "null"
              description: Document series code. The API key dedicated series is used when
                omitted.
            issue_date:
              type:
                - string
                - "null"
              format: date
              description: Document issue date in YYYY-MM-DD format.
            auto_confirm:
              type:
                - boolean
                - "null"
              description: Whether the document should be finalized automatically.
            payment_option_id:
              type:
                - string
                - "null"
              description: Payment option identifier.
            payment_method_id:
              type:
                - string
                - "null"
              description: Payment method identifier.
            warehouse_id:
              type:
                - string
                - "null"
              description: Warehouse identifier used for stock movements.
            salesman_code:
              type:
                - string
                - "null"
              description: Salesman code assigned to the document.
            reference:
              type:
                - string
                - "null"
              description: External document reference.
            notes:
              type:
                - string
                - "null"
              description: Document notes. Use \n to separate lines.
            commitment_number:
              type:
                - string
                - "null"
              description: B2G commitment number (LCPA), max 50 characters. Sent as CIUS-PT
                BT-19 cbc:AccountingCost; defaults to the customer's
                settings.commitment_number when omitted. Optional.
              maxLength: 50
            requesting_service:
              type:
                - string
                - "null"
              description: B2G requesting service of the public customer, max 50 characters.
                Sent as CIUS-PT BT-10 cbc:BuyerReference; defaults to the
                customer's settings.requesting_service when omitted. Optional.
              maxLength: 50
            tax_included:
              type:
                - boolean
                - "null"
              description: Whether item prices already include tax.
            retention:
              type:
                - number
                - "null"
              description: Withholding retention percentage.
              minimum: 0
              maximum: 100
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              minLength: 3
              maxLength: 3
            without_values:
              type:
                - boolean
                - "null"
              description: 'Transport guides (GT/GR) only: when true, every line is issued
                with price 0 ("documento sem valores").'
          required:
            - type
        items:
          type: array
          description: >-
            Sales document lines. For invoices (FA, FR, FS): product_reference,
            quantity and

            unit_price_net are required. For credit notes (NC): each item

            instead references a credited source line via origin_id (source

            document id from a previous POST /sales response) and

            origin_line_id (the items[].id of that document); quantity is

            optional and defaults to the line's remaining creditable quantity.
          examples:
            - - product_reference: ART001
                quantity: 2
                unit_price_net: 10
          items:
            type: object
            properties:
              product_reference:
                type: string
                description: Product reference sold in this line. Required for invoices; ignored
                  for credit notes.
              quantity:
                type: number
                description: Quantity. Required for invoices; optional for credit notes
                  (defaults to the line's remaining creditable quantity).
              unit_price_net:
                type: number
                description: Unit price. Required for invoices/proforma/quote; optional for
                  credit notes (taken from the source line) and transport guides
                  (may be omitted / zeroed via document.without_values).
                minimum: 0
              notes:
                type:
                  - string
                  - "null"
                description: Line notes. Use \n to separate lines.
              origin_id:
                type:
                  - string
                  - "null"
                description: "Credit note only: source document id (a previous POST /sales
                  `data.id`) whose line is being credited. Required per credited
                  line, but may be omitted for a Desconto/Rappel product line."
              origin_line_id:
                type:
                  - string
                  - "null"
                description: "Credit note only: source line id (an `items[].id` of the source
                  document). Required per credited line, but may be omitted for
                  a Desconto/Rappel product line."
            required:
              - product_reference
              - quantity
              - unit_price_net
        transport:
          type: object
          description: |-
            Transport data for goods movement. Required for transport guides
            (GT/GR): both `load` and `delivery` blocks must be complete. The
            load `date_time` (movement start) must be at/after now — AT rejects
            a past start time.
          examples:
            - vehicle_registration: AA-00-AA
              load:
                address: Rua A
                city: Lisboa
                postal_code: 1000-001
                country_code: PT
                date_time: 2026-07-22 09:00
              delivery:
                address: Rua B
                city: Porto
                postal_code: 4000-001
                country_code: PT
                date_time: 2026-07-22 18:00
          properties:
            vehicle_registration:
              type:
                - string
                - "null"
              description: Vehicle registration number (optional even for transport guides).
            load:
              type:
                - object
                - "null"
              description: Loading address data.
              properties:
                address:
                  type:
                    - string
                    - "null"
                  description: Loading street address.
                city:
                  type:
                    - string
                    - "null"
                  description: Loading city.
                postal_code:
                  type:
                    - string
                    - "null"
                  description: Loading postal code.
                country_code:
                  type:
                    - string
                    - "null"
                  description: Loading country code.
                  minLength: 2
                  maxLength: 2
                date_time:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Loading date and time (movement start; must be at/after now for
                    AT).
            delivery:
              type:
                - object
                - "null"
              description: Delivery address data.
              properties:
                address:
                  type:
                    - string
                    - "null"
                  description: Delivery street address.
                city:
                  type:
                    - string
                    - "null"
                  description: Delivery city.
                postal_code:
                  type:
                    - string
                    - "null"
                  description: Delivery postal code.
                country_code:
                  type:
                    - string
                    - "null"
                  description: Delivery country code.
                  minLength: 2
                  maxLength: 2
                date_time:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Delivery date and time (must be on/after the load date).
      required:
        - customer
        - document
        - items
      title: UpsertSaleRequest
    UpsertSalesmanRequest:
      type: object
      properties:
        code:
          type: string
          description: Salesman code used as the public identifier.
          examples:
            - V001
        name:
          type: string
          description: Salesman display name.
          examples:
            - Joao Silva
        mobile:
          type:
            - string
            - "null"
          description: Salesman mobile phone number.
          examples:
            - "+351912345678"
        active:
          type:
            - boolean
            - "null"
          description: Whether the salesman is active.
          examples:
            - true
      required:
        - code
        - name
      title: UpsertSalesmanRequest
    UpsertScheduleRequest:
      type: object
      properties:
        schedule:
          type: object
          description: Recurring schedule configuration.
          examples:
            - description: Monthly invoice
              frequency: monthly
              start_date: 2026-06-01
              auto_confirm: true
          properties:
            description:
              type: string
              description: Schedule description.
            frequency:
              type: string
              description: Recurrence frequency.
              enum:
                - daily
                - weekly
                - monthly
                - monthly_last_day
                - bi_monthly
                - quarterly
                - quad_monthly
                - semi_annual
                - annual
            start_date:
              type: string
              format: date
              description: First scheduled generation date in YYYY-MM-DD format.
            end_date:
              type:
                - string
                - "null"
              format: date
              description: Last scheduled generation date in YYYY-MM-DD format.
            auto_confirm:
              type:
                - boolean
                - "null"
              description: Whether generated documents should be confirmed automatically.
            send_email:
              type:
                - boolean
                - "null"
              description: Whether generated documents should be emailed automatically.
            recipient_email:
              type:
                - string
                - "null"
              format: email
              description: Email recipient for generated documents.
          required:
            - description
            - frequency
            - start_date
        customer:
          type: object
          description: Customer used by generated documents.
          examples:
            - code: CLI001
          properties:
            code:
              type: string
              description: Customer code.
          required:
            - code
        document:
          type: object
          description: Template document metadata used for each generated document.
          examples:
            - type: FT
              payment_type: cash
              warehouse_id: "1"
              currency: EUR
          properties:
            type:
              type: string
              description: Generated document type acronym.
            series:
              type:
                - string
                - "null"
              description: Document series code. The API key dedicated series is used when
                omitted.
            payment_type:
              type:
                - string
                - "null"
              description: Payment type used by the generated document.
            warehouse_id:
              type:
                - string
                - "null"
              description: Warehouse identifier used by the generated document.
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              minLength: 3
              maxLength: 3
            reference:
              type:
                - string
                - "null"
              description: External document reference.
            notes:
              type:
                - string
                - "null"
              description: Document notes. Use \n to separate lines.
            commitment_number:
              type:
                - string
                - "null"
              description: B2G commitment number (LCPA), max 50 characters. Copied to each
                generated document and sent as CIUS-PT BT-19 cbc:AccountingCost;
                defaults to the customer's settings.commitment_number when
                omitted. Optional.
              maxLength: 50
            requesting_service:
              type:
                - string
                - "null"
              description: B2G requesting service of the public customer, max 50 characters.
                Copied to each generated document and sent as CIUS-PT BT-10
                cbc:BuyerReference; defaults to the customer's
                settings.requesting_service when omitted. Optional.
              maxLength: 50
          required:
            - type
        items:
          type: array
          description: Template document lines used for each generated document.
          examples:
            - - product_reference: ART001
                quantity: 1
                unit_price: 100
                discount: 0
          items:
            type: object
            properties:
              product_reference:
                type: string
                description: Product reference.
              quantity:
                type: number
                description: Quantity.
              unit_price:
                type: number
                description: Unit price.
              discount:
                type:
                  - number
                  - "null"
                description: Line discount percentage.
                minimum: 0
                maximum: 100
              notes:
                type:
                  - string
                  - "null"
                description: Line notes. Use \n to separate lines.
            required:
              - product_reference
              - quantity
              - unit_price
      required:
        - schedule
        - customer
        - document
        - items
      title: UpsertScheduleRequest
    UpsertStockRequest:
      type: object
      properties:
        pdf:
          type:
            - boolean
            - "null"
          description: "Deprecated and ignored: the response always includes pdf_url, a
            link that renders the PDF on demand."
        document:
          type: object
          description: Stock document metadata.
          examples:
            - type: IN
              system_entry_date: 2026-05-27
              reference: MOV-001
              currency: EUR
          properties:
            type:
              type: string
              description: "Stock document type acronym. Allowed types: IN, ES, SS."
            system_entry_date:
              type:
                - string
                - "null"
              format: date-time
              description: System entry date.
            auto_confirm:
              type:
                - boolean
                - "null"
              description: Whether the document should be finalized automatically.
            reference:
              type:
                - string
                - "null"
              description: External document reference.
            notes:
              type:
                - string
                - "null"
              description: Document notes. Use \n to separate lines.
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              minLength: 3
              maxLength: 3
            pdf:
              type:
                - boolean
                - "null"
              description: "Deprecated and ignored: the response always includes pdf_url, a
                link that renders the PDF on demand."
          required:
            - type
        movement:
          type: object
          description: Stock movement origin and destination.
          examples:
            - source_warehouse_id: "1"
              destination_warehouse_id: "2"
          properties:
            source_warehouse_id:
              type:
                - string
                - "null"
              description: Source warehouse identifier.
            destination_warehouse_id:
              type:
                - string
                - "null"
              description: Destination warehouse identifier.
        items:
          type: array
          description: Stock movement lines.
          examples:
            - - product_reference: ART001
                quantity: 2
                unit_price_net: 10
                taxes:
                  - tax_rate: 23
          items:
            type: object
            properties:
              product_reference:
                type: string
                description: Product reference moved in this line.
              quantity:
                type: number
                description: Quantity moved.
              unit_price_net:
                type: number
                description: Net unit price without tax.
                minimum: 0
              taxes:
                type: array
                description: Tax rows applied to this line.
                items:
                  type: object
                  properties:
                    tax_rate:
                      type: number
                      description: Tax rate percentage.
                      minimum: 0
                    exemption_code:
                      type:
                        - string
                        - "null"
                      description: Tax exemption code when tax rate is zero.
                      maxLength: 20
                    exemption_reason:
                      type:
                        - string
                        - "null"
                      description: Tax exemption legal reason.
                  required:
                    - tax_rate
                minItems: 1
              notes:
                type:
                  - string
                  - "null"
                description: Line notes. Use \n to separate lines.
            required:
              - product_reference
              - quantity
              - unit_price_net
              - taxes
      required:
        - document
        - movement
        - items
      title: UpsertStockRequest
    UpsertSupplierRequest:
      type: object
      properties:
        identity:
          type: object
          description: Supplier identity data.
          examples:
            - code: FOR001
              name: Fornecedor XPTO
              tax_id: "509999999"
              country_code: PT
              person_type: L
          properties:
            code:
              type:
                - string
                - "null"
              description: Supplier code used as the public identifier.
              maxLength: 20
            name:
              type: string
              description: Supplier legal or commercial name.
              maxLength: 500
            tax_id:
              type: string
              description: Supplier tax identification number.
              maxLength: 20
            country_code:
              type: string
              description: ISO 3166-1 alpha-2 country code.
              minLength: 2
              maxLength: 2
            region_code:
              type:
                - string
                - "null"
              description: Regional code for tax or address classification.
              maxLength: 10
            person_type:
              type:
                - string
                - "null"
              description: "Person type: L for legal entity, F for individual."
              enum:
                - L
                - F
                - null
          required:
            - name
            - tax_id
            - country_code
        addresses:
          type: array
          description: Supplier addresses.
          examples:
            - - name: Sede
                type: billing
                country_code: PT
                address: Rua A
                postal_code: 1000-001
                city: Lisboa
                is_main: true
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 1000
              type:
                type: string
                enum:
                  - billing
                  - shipping
              country_code:
                type: string
                minLength: 2
                maxLength: 2
              address:
                type: string
                maxLength: 500
              postal_code:
                type: string
                maxLength: 50
              city:
                type: string
                maxLength: 100
              id:
                type:
                  - string
                  - "null"
              street_number:
                type:
                  - string
                  - "null"
                maxLength: 20
              state:
                type:
                  - string
                  - "null"
                maxLength: 100
              neighborhood:
                type:
                  - string
                  - "null"
                maxLength: 100
              address_extra:
                type:
                  - string
                  - "null"
                maxLength: 500
              is_main:
                type:
                  - boolean
                  - "null"
              active:
                type:
                  - boolean
                  - "null"
            required:
              - name
              - type
              - country_code
              - address
              - postal_code
              - city
        contacts:
          type:
            - array
            - "null"
          description: Supplier contacts.
          examples:
            - - name: Compras
                type: email
                value: compras@fornecedor.pt
                country_code: PT
                active: true
          items:
            type: object
            properties:
              name:
                type:
                  - string
                  - "null"
                maxLength: 200
              type:
                type: string
                enum:
                  - mobile
                  - phone
                  - email
              value:
                type: string
                maxLength: 200
              country_code:
                type: string
                minLength: 2
                maxLength: 2
              id:
                type:
                  - string
                  - "null"
              active:
                type:
                  - boolean
                  - "null"
            required:
              - type
              - value
              - country_code
        billing:
          type: object
          description: Supplier billing defaults.
          examples:
            - payment_option_id: "30"
              global_discount: 0
              currency_code: EUR
          properties:
            payment_option_id:
              type:
                - string
                - "null"
            tax_entity_id:
              type:
                - string
                - "null"
            global_discount:
              type:
                - number
                - "null"
              minimum: 0
            line_discount:
              type:
                - number
                - "null"
              minimum: 0
            apply_retention_tax:
              type:
                - boolean
                - "null"
            retention_tax_rate:
              type:
                - number
                - "null"
              minimum: 0
            currency_code:
              type:
                - string
                - "null"
              maxLength: 10
        settings:
          type: object
          description: Supplier settings and notes.
          examples:
            - website: https://fornecedor.pt
              locked: false
          properties:
            website:
              type:
                - string
                - "null"
              maxLength: 500
            notes:
              type:
                - string
                - "null"
              maxLength: 500
            locked:
              type:
                - boolean
                - "null"
      required:
        - identity
        - addresses
      title: UpsertSupplierRequest
    UpsertUnitRequest:
      type: object
      properties:
        code:
          type: string
          description: Unit code used as the public identifier.
          examples:
            - UN
        description:
          type: string
          description: Unit description.
          examples:
            - Unidade
        active:
          type:
            - boolean
            - "null"
          description: Whether the unit is active.
          examples:
            - true
      required:
        - code
        - description
      title: UpsertUnitRequest
    PaymentWebhookEvent:
      type: object
      description: Body of every payment webhook request. `event` and `event_id`
        always come first.
      required:
        - event
        - event_id
        - occurred_at
        - entity
        - method
        - amount
        - currency
        - receipt_created
        - company
      properties:
        event:
          type: string
          enum:
            - payment.received
            - receipt.created
            - webhook.test
        event_id:
          type: string
          format: uuid
          description: Unique per event; identical on retries and manual resends (use it
            to de-duplicate).
        occurred_at:
          type: string
          format: date-time
          description: When ZS GO processed the payment (company timezone).
        entity:
          type: string
          enum:
            - lusopay
            - ifthenpay
        method:
          type: string
          enum:
            - multibanco
            - mbway
        amount:
          type: number
          description: Amount confirmed by the payment entity.
        currency:
          type: string
          example: EUR
        paid_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        reference:
          oneOf:
            - type: object
              description: Multibanco entity/reference; `null` for MB WAY.
              properties:
                entity:
                  type: string
                  example: "12345"
                reference:
                  type: string
                  example: "123456789"
            - type: "null"
        receipt_created:
          type: boolean
          description: "`true` only for `receipt.created`."
        document:
          oneOf:
            - $ref: "#/components/schemas/PaymentWebhookDocument"
            - type: "null"
        receipt:
          oneOf:
            - $ref: "#/components/schemas/PaymentWebhookReceipt"
            - type: "null"
        company:
          $ref: "#/components/schemas/PaymentWebhookCompany"
        test:
          type: boolean
          description: Present and `true` on `webhook.test` events only.
    PaymentWebhookDocument:
      type: object
      description: The sales document (invoice) the payment refers to. Same `id` as
        `GET /sales/{id}`.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: FA
        series:
          type: string
          example: A
        number:
          oneOf:
            - type: integer
            - type: "null"
        label:
          type: string
          example: FA A/1001
        date:
          oneOf:
            - type: string
              format: date
            - type: "null"
        due_date:
          oneOf:
            - type: string
              format: date
            - type: "null"
        total:
          type: number
        total_paid:
          type: number
        status:
          type: integer
          description: "Document status: 5 closed (unpaid), 7 paid."
        mb_reference:
          oneOf:
            - type: string
            - type: "null"
        client:
          type: object
          properties:
            id:
              oneOf:
                - type: integer
                - type: "null"
            name:
              oneOf:
                - type: string
                - type: "null"
            tax_id:
              oneOf:
                - type: string
                - type: "null"
    PaymentWebhookReceipt:
      type: object
      description: Receipt issued automatically (only on `receipt.created`).
      properties:
        id:
          type: integer
        type:
          type: string
          example: RC
        series:
          type: string
          example: A
        number:
          oneOf:
            - type: integer
            - type: "null"
        label:
          type: string
          example: RC A/87
        date:
          oneOf:
            - type: string
              format: date
            - type: "null"
        datetime:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        total:
          type: number
    PaymentWebhookCompany:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tax_id:
          type: string
  responses:
    ValidationException:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Errors overview.
              errors:
                type: object
                description: A detailed description of each field that failed validation.
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
              - message
              - errors

      security: []
components:
  securitySchemes:
    https:
      type: http
      scheme: bearer
  schemas:
    CreateSaftExportRequest:
      type: object
      properties:
        export_type:
          type: string
          enum:
            - annual
            - monthly
            - date_range
        year:
          type:
            - string
            - "null"
        month:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
        start_date:
          type:
            - string
            - "null"
          format: date
        end_date:
          type:
            - string
            - "null"
          format: date
        use_company_address:
          type: boolean
        morada:
          type:
            - string
            - "null"
        codpostal:
          type:
            - string
            - "null"
        localidade:
          type:
            - string
            - "null"
      required:
        - export_type
      title: CreateSaftExportRequest
    DocumentCommission:
      type: array
      items:
        type: string
      minItems: 0
      maxItems: 0
      title: DocumentCommission
    StorePaymentRequest:
      type: object
      properties:
        pdf:
          type:
            - boolean
            - "null"
          description: "Deprecated and ignored: the response always includes pdf_url, a
            link that renders the PDF on demand."
          examples:
            - true
        supplier:
          type: object
          description: Supplier information for the payment.
          examples:
            - code: FOR001
          properties:
            code:
              type: string
              description: Supplier code that identifies the supplier receiving the payment.
              examples:
                - FOR001
          required:
            - code
        document:
          type: object
          description: Payment document metadata.
          examples:
            - issue_date: 2026-05-27
              currency: EUR
              notes: Supplier payment by bank transfer.
          properties:
            issue_date:
              type:
                - string
                - "null"
              format: date-time
              description: Payment issue date.
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              minLength: 3
              maxLength: 3
            notes:
              type:
                - string
                - "null"
              description: Internal or supplier-facing notes for the payment. Use \n to
                separate lines.
        payments:
          type: array
          description: Payment methods and amounts used to pay the supplier.
          examples:
            - - payment_method_id: "1"
                amount: 100.5
                amount_tendered: 100.5
          items:
            type: object
            properties:
              payment_method_id:
                type: string
                description: Payment method identifier.
              amount:
                type: number
                description: Amount paid with this payment method.
              amount_tendered:
                type:
                  - number
                  - "null"
                description: Amount tendered before change, when applicable.
            required:
              - payment_method_id
              - amount
        allocations:
          type: array
          description: Purchase documents and amounts settled by this payment.
          examples:
            - - document_type: CFA
                purchase_id: "12345"
                amount: 100.5
          items:
            type: object
            properties:
              document_type:
                type: string
                description: "Type of the purchase document being settled. Allowed types: CFA,
                  CFS, CFR."
              purchase_id:
                type: string
                description: Identifier of the purchase document being settled.
              amount:
                type: number
                description: Amount to allocate to the selected purchase document.
            required:
              - document_type
              - purchase_id
              - amount
      required:
        - supplier
        - document
        - payments
        - allocations
      title: StorePaymentRequest
    StoreReceiptRequest:
      type: object
      properties:
        pdf:
          type:
            - boolean
            - "null"
          description: "Deprecated and ignored: the response always includes pdf_url, a
            link that renders the PDF on demand."
          examples:
            - true
        email:
          type:
            - object
            - "null"
          description: |-
            Optional: email the generated PDF after the receipt is finalized.
            When omitted, no email is sent. When `to` is omitted, the document
            client's email is used. Best-effort — a failed send is reported in
            the response `meta.email_warning` and does not fail creation.
          examples:
            - to:
                - customer@example.com
              cc:
                - copy@example.com
          properties:
            to:
              type:
                - array
                - "null"
              items:
                type: string
                format: email
            cc:
              type:
                - array
                - "null"
              items:
                type: string
                format: email
        customer:
          type: object
          description: Customer information for the receipt.
          examples:
            - code: CLI001
          properties:
            code:
              type: string
              description: Customer code that identifies the customer receiving the receipt.
              examples:
                - CLI001
          required:
            - code
        document:
          type: object
          description: Receipt document metadata.
          examples:
            - issue_date: 2026-05-27
              payment_method_id: "1"
              currency: EUR
              notes: Payment received by bank transfer.
          properties:
            issue_date:
              type:
                - string
                - "null"
              description: Receipt issue date in YYYY-MM-DD format. Defaults to the current
                date when omitted.
              examples:
                - 2026-05-27
            payment_method_id:
              type: string
              description: Payment method identifier used to settle the allocated documents.
              examples:
                - "1"
            currency:
              type:
                - string
                - "null"
              description: ISO 4217 currency code.
              examples:
                - EUR
            notes:
              type:
                - string
                - "null"
              description: Internal or customer-facing notes for the receipt. Use \n to
                separate lines.
              examples:
                - Payment received by bank transfer.
          required:
            - payment_method_id
        allocations:
          type: array
          description: Documents and amounts settled by this receipt.
          examples:
            - - document_type: FA
                document_id: "12345"
                amount: 100.5
          items:
            type: object
            properties:
              document_type:
                type: string
                description: "Type of the document being settled. Allowed types: FA, NC, FAR."
                examples:
                  - FA
              document_id:
                type: string
                description: Identifier of the document being settled.
                examples:
                  - "12345"
              amount:
                type: number
                description: Amount to allocate to the selected document.
                examples:
                  - 100.5
            required:
              - document_type
              - document_id
              - amount
      required:
        - customer
        - document
        - allocations
      title: StoreReceiptRequest
    UpsertClientRequest:
      type: object
      properties:
        identity:
          type: object
          description: Customer identity data.
          examples:
            - code: 1001
              name: Empresa XPTO, Lda
              tax_id: "509999999"
          properties:
            code:
              type:
                - integer
                - "null"
              description: Customer code. When omitted on create, the system may assign the
                next available code.
              examples:
                - 1001
            name:
              type: string
              description: Customer legal or commercial name.
              examples:
                - Empresa XPTO, Lda
            tax_id:
              type:
                - string
                - "null"
              description: Customer tax identification number.
              examples:
                - "509999999"
            tax_subject:
              type:
                - boolean
                - "null"
              description: Whether the customer is a VAT taxable person (sujeito passivo).
              examples:
                - false
          required:
            - name
        address:
          type: object
          description: Customer billing address.
          examples:
            - country_code: PT
              address: Rua A
              postal_code: 1000-001
              city: Lisboa
          properties:
            country_code:
              type: string
              description: ISO 3166-1 alpha-2 country code.
              examples:
                - PT
            address:
              type:
                - string
                - "null"
              description: Street address.
              examples:
                - Rua A
            postal_code:
              type:
                - string
                - "null"
              description: Postal code.
              examples:
                - 1000-001
            city:
              type:
                - string
                - "null"
              description: City or locality.
              examples:
                - Lisboa
            region_code:
              type:
                - string
                - "null"
              description: Fiscal region code for the customer's country (e.g. CON, AC, MA for
                Portugal).
              examples:
                - CON
          required:
            - country_code
        billing:
          type: object
          description: Customer billing defaults.
          examples:
            - payment_option_id: "30"
              payment_method_id: "1"
              price_line: 1
              global_discount: 0
          properties:
            payment_option_id:
              type:
                - string
                - "null"
              description: Default payment option identifier.
              examples:
                - "30"
            payment_method_id:
              type:
                - string
                - "null"
              description: Default payment method identifier.
              examples:
                - "1"
            exemption_code:
              type:
                - string
                - "null"
              description: Tax exemption code applied by default.
              examples:
                - M01
            salesman_code:
              type:
                - string
                - "null"
              description: Default salesman code.
              examples:
                - V001
            price_line:
              type: integer
              description: Default price line identifier.
              examples:
                - 1
            global_discount:
              type:
                - number
                - "null"
              description: Global discount percentage applied by default.
              examples:
                - 5
            retention:
              type:
                - boolean
                - "null"
              description: Whether withholding retention applies by default.
              examples:
                - false
            retention_rate:
              type:
                - number
                - "null"
              description: Withholding retention rate.
              examples:
                - 25
            exemption_detail:
              type:
                - string
                - "null"
              description: Free-text detail to justify the tax exemption code.
              examples:
                - Exportação de bens
          required:
            - price_line
        settings:
          type: object
          description: Customer contact details, account flags and document delivery mode.
          examples:
            - email: cliente@empresa.pt
              phone: "+351211234567"
              inactive: false
              print_type: 1
          properties:
            phone:
              type:
                - string
                - "null"
              description: Customer phone number.
              examples:
                - "+351211234567"
            mobile:
              type:
                - string
                - "null"
              description: Customer mobile phone number.
              examples:
                - "+351912345678"
            email:
              type:
                - string
                - "null"
              description: Customer email address.
              examples:
                - cliente@empresa.pt
            website:
              type:
                - string
                - "null"
              description: Customer website URL.
              examples:
                - https://empresa.pt
            fax:
              type:
                - string
                - "null"
              description: Customer fax number.
              examples:
                - "+351211234568"
            notes:
              type:
                - string
                - "null"
              description: Internal notes about the customer.
              examples:
                - Cliente preferencial.
            inactive:
              type:
                - boolean
                - "null"
              description: Whether the customer is inactive.
              examples:
                - false
            in_litigation:
              type:
                - boolean
                - "null"
              description: Whether the customer is marked as in litigation.
              examples:
                - false
            blocked:
              type:
                - boolean
                - "null"
              description: Whether the customer is blocked for new operations.
              examples:
                - false
            print_type:
              type:
                - integer
                - "null"
              description: >-
                Document delivery / electronic invoicing mode (default 1): 1 =
                PDF only; 2 = PDF + CIUS-PT XML,

                downloadable through the sale `xml_url`; 3 = CIUS-PT webservice,
                the XML is sent to Saphety when

                the document is finalized. 2 is available to Portuguese
                companies, 3 only when Saphety CIUS-PT

                electronic invoicing is active for the company (422 otherwise).
                Customers with print_type 2 or 3

                must have a full billing address (address, postal_code, city)
                before documents can be issued.
              examples:
                - 1
            commitment_number:
              type:
                - string
                - "null"
              description: >-
                Default B2G commitment number (LCPA) copied onto new sales
                documents when the sale

                payload omits `document.commitment_number`. Emitted as CIUS-PT
                BT-19 (cbc:AccountingCost).

                Optional, max 50 characters, only meaningful for print_type 2 or
                3.
              examples:
                - CMP-2026/000123
            requesting_service:
              type:
                - string
                - "null"
              description: >-
                Default B2G requesting service of the public customer, copied
                onto new sales documents

                when the sale payload omits `document.requesting_service`.
                Emitted as CIUS-PT BT-10

                (cbc:BuyerReference). Optional, max 50 characters, only
                meaningful for print_type 2 or 3.
              examples:
                - Divisão de Aprovisionamento
      required:
        - identity
        - address
        - billing
        - settings
      title: UpsertClientRequest
    UpsertFamilyRequest:

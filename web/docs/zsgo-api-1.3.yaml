openapi: 3.1.0
info:
  title: zsgo
  version: 1.0.0
  description: >-
    External API for third-party integrations with ZSGO invoicing platform.
    Supports document management, entity CRUD, products, and schedules.
    Available on every version with the API addon; the purchases, stocks and
    treasury/payments (supplier current account) endpoints require the PRO
    version (or a trial) and answer 403 on BASIC/LITE.


    ## Payment webhooks (LusoPay / IfThenPay)


    Besides the REST endpoints below, ZS GO can **notify your system** when a
    payment for a sales

    document is confirmed by LusoPay or IfThenPay. The company configures one
    webhook URL and one

    secret per payment entity in **Definições › Métodos de Pagamento** (the same
    screen offers a

    test button and this documentation). See the `webhooks` section of this
    document for the full

    request definitions.


    **Events**


    | Event | When |

    |---|---|

    | `receipt.created` | "Processar Pagamentos Automaticamente" is on: sent
    after the receipt is issued and the invoice marked as paid. |

    | `payment.received` | Automatic receipts are off: sent as soon as the
    entity confirms the payment (ZS GO does not change the document). Also sent
    with `receipt_created: false` when the paid amount differs from the invoice
    total (no receipt is issued). |

    | `webhook.test` | Sent from the "Testar webhook" button; payload carries
    `test: true` and sample data. |


    POS MB WAY payments never trigger the webhook.


    **Request**: `POST` with a JSON body (UTF-8) and headers `X-ZSGO-Event`,
    `X-ZSGO-Delivery`

    (unique event id, repeated on retries), `X-ZSGO-Timestamp` (Unix seconds)
    and

    `X-ZSGO-Signature` (`sha256=` + hex HMAC-SHA256 of `"{timestamp}.{raw
    body}"` using the entity

    secret). `User-Agent` is `ZSGO-Webhook/1.0`.


    **Response**: answer any **2xx** within **10 s**. Anything else (or a
    timeout) counts as a

    failure and the delivery is retried, **3 attempts** in total (+30 s, +120 s
    after the first),

    always with the same `event_id` and body. Use `event_id` to de-duplicate.


    **Verify the signature** (mandatory): read the raw body bytes, compute

    `HMAC-SHA256(secret, timestamp + "." + body)`, compare in constant time with
    the value after

    `sha256=`, and reject timestamps older than 5 minutes. Source IPs are not
    fixed: trust the

    signature, not the IP.
servers:
  - url: https://sandbox.zsgo.pt/api/v1/ext
tags:
  - name: Clients
    description: Manage customer records for the authenticated company, including
      listing, retrieval, creation, updates, and deletion.
  - name: Suppliers
    description: Manage supplier records for the authenticated company, including
      listing, retrieval, creation, updates, and deletion.
  - name: Families
    description: Manage product families used to classify catalog items for pricing,
      reporting, and filtering.
  - name: PaymentOptions
    description: Manage payment terms and payment option records used by customers,
      suppliers, and documents.
  - name: Products
    description: Manage product and service catalog records for the authenticated
      company, including listing, retrieval, creation, updates, and deletion.
  - name: Salesmen
    description: Manage salesperson records used for commercial assignment,
      filtering, and reporting.
  - name: Units
    description: Manage measurement units used by products, stock items, and document lines.
  - name: PaymentMethods
    description: Manage payment methods (Dinheiro, Cheque, Cartão…) available for
      sales, purchases, and treasury operations.
  - name: Warehouses
    description: List warehouses available for stock control, document creation, and
      inventory operations.
  - name: DocumentTypes
    description: List document types available for external API document creation
      and filtering.
  - name: Series
    description: List the document series available to the authenticated API key for
      document issuance and filtering.
  - name: Exemptions
    description: List VAT exemption codes available for products, customers,
      suppliers, and documents.
  - name: PriceLines
    description: List available price lines used to price customers and products.
  - name: Countries
    description: List countries available for addresses, customer and supplier
      records, and fiscal configuration.
  - name: Sales
    description: Manage sales documents for the authenticated company, including
      listing, retrieval, creation, and annulment.
  - name: Purchases
    description: Manage purchase documents for the authenticated company, including
      listing, retrieval, creation, updates, and annulment.
  - name: Stock
    description: Manage stock movement documents for the authenticated company,
      including listing, retrieval, creation, updates, and annulment.
  - name: Treasury Payments
    description: Manage supplier treasury payments and settlement allocations.
      Payments are always created as CAL documents in the API key dedicated
      series.
  - name: Treasury Receipts
    description: Manage customer treasury receipts and settlement allocations.
      Receipts are always created as RC documents in the API key dedicated
      series.
  - name: SAF-T Exports
    description: Start asynchronous SAF-T (PT) exports, poll their status and
      download the resulting file.
  - name: Schedules
    description: Manage recurring schedule definitions, previews, activation state,
      and next document generation.
  - name: Commissions
    description: Query salesperson commissions generated from closed sales documents.
  - name: Payment Webhooks
    description: "Outbound notifications ZS GO sends to a URL configured by the
      company for LusoPay / IfThenPay payments. Not an endpoint you call: your
      server receives these requests."
security:
  - https: []
paths:
  /clients:
    get:
      operationId: clients.index
      description: Returns paginated customer records visible to the authenticated API key.
      summary: List clients
      tags:
        - Clients
      parameters:
        - name: page
          in: query
          schema:
            type:
              - integer
              - "null"
            minimum: 1
        - name: per_page
          in: query
          schema:
            type:
              - integer
              - "null"
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type:
              - string
              - "null"
        - name: inactive
          in: query
          schema:
            type:
              - boolean
              - "null"
        - name: in_litigation
          in: query
          schema:
            type:
              - integer
              - "null"
            enum:
              - "0"
              - "1"
              - "2"
              - null
      responses:
        "200":
          description: Paginated client list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: array
                      items: []
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_items:
                        type: integer
                      page_count:
                        type: integer
                    required:
                      - page
                      - per_page
                      - total_items
                      - page_count
                  errors:
                    type: object
                required:
                  - data
                  - meta
                  - errors
        "422":
          $ref: "#/components/responses/ValidationException"
        "500":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: "null"
                  meta:
                    anyOf:
                      - type: array
                        items:
                          type: string
                        minItems: 0
                        maxItems: 0
                      - type: object
                  errors:
                    anyOf:
                      - type: object
                        properties:
                          message:
                            type: string
                          fields:
                            type: string
                        required:
                          - message
                          - fields
                      - type: object
                required:
                  - data
                  - meta
                  - errors
    post:
      operationId: clients.store
      description: Creates a customer using the public nested client payload.
      summary: Create a client
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClientRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: string
        "201":
          description: Client created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: []
                  meta:
                    type: object
                  errors:
                    type: object
                required:
                  - data
                  - meta
                  - errors
        "409":
          description: Client code already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: "null"
                  meta:
                    type: object
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                required:
                  - data
                  - meta
                  - errors
        "422":
          description: Validation or business rule error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: "null"
                  meta:
                    type: object
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                      fields:
                        type: array
                        items: []
                    required:
                      - message
                required:
                  - data
                  - meta
                  - errors
        "500":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: "null"
                  meta:
                    anyOf:
                      - type: array
                        items:
                          type: string
                        minItems: 0
                        maxItems: 0
                      - type: object
                  errors:
                    anyOf:
                      - type: object
                        properties:
                          message:
                            type: string
                          fields:
                            type: string
                        required:
                          - message
                          - fields
                      - type: object
                required:
                  - data
                  - meta
                  - errors
